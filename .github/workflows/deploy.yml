name: Deploy to GitHub Pages

on:
  push:
    branches: [main]      # main에 push하면 자동 배포
  workflow_dispatch:      # Actions 탭에서 수동 실행도 가능

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24     # 로컬과 같은 메이저 버전
          cache: npm
      - run: npm ci            # package-lock.json 기준으로 정확히 설치
      - run: npm run build     # 타입 검사 + vite build → dist/ 생성
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
